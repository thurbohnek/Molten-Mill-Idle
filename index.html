<style>
/* Layout: centered stage (full width up to 1400px) with full-bleed canvas + HUD overlay respecting safe areas */
:root{
  color-scheme:dark;
  --bg:#0b0d12;--frame:#14181f;--floor:#3b4048;--floor2:#343940;--seam:#2b2f36;--paint:#f2c230;
  --hazard:#f5c518;--ink:#111318;--steel:#8b939e;--steeld:#565d67;--steell:#b9c1cb;--scrap:#6f6a64;
  --rust:#7a5240;--molten:#ff7a1a;--moltenhi:#ffd36b;--moltend:#c2410c;--arc:#d6ecff;
  --vest:#ff7a1f;--vestl:#ffd23f;--helmet:#f8f6ee;--helper:#ffd23f;--skin:#e7b48f;--coin:#ffcf33;
  --ui:#f4f1ea;--uidim:#a7adb7;--refrac:#7c4a3a;--truck:#2f6fb5;--good:#5fd38d;
  --night:rgba(6,9,18,.5);--panel:rgba(16,19,26,.84);--panel2:rgba(16,19,26,.96);--focus:#ffd23f;
  --shred:#9aa6b4;--kalk:#e9e4d6;--kull:#2b2b2e;--leg:#7d8fa6;--rebar:#7b5f4c;--wire:#a7774f;
  --prem:#6fb7ff;--water:#123049;--water2:#1b4566;--ship:#8c2f2a;--rail:#5b5148;--locked:rgba(8,10,14,.62);
  --danger:#ff6b5a;--o2:#4f8fd8;--elek:#30333a;--ildf:#a4553f;--gass:#e8742c;--vann:#3a8fd0;--tcore:#3d4756;--kokille:#3b3f46;--slag:#56524d;--hette:#9b7b4f;--bind:#b8bec7;--valse:#9aa3ad;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ui);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{box-sizing:border-box;height:100%;display:flex;justify-content:center;align-items:stretch;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
#stage{position:relative;width:100%;max-width:1400px;height:100%;overflow:hidden;background:var(--frame)}
/* the plant runs left → right, so the stage may grow wide; framed card only when there is height to spare */
@media (min-width:560px) and (min-height:600px){#app{padding-top:16px;padding-bottom:16px;align-items:center}#stage{max-height:940px;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:inset 0 0 0 3px var(--focus)}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none;transition:opacity .4s}
.chip{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap}
#money{font-size:19px;font-weight:800}#money.long{font-size:15px;padding-left:10px;padding-right:10px;gap:5px}#money.tight{font-size:13px;padding-left:8px;padding-right:8px;gap:4px}#money.tight .coin{width:15px;height:15px}
#money.bump{animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--coin) 55%,#c98a00);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.heat{color:var(--uidim);font-size:13px;position:relative;overflow:hidden}.heat b{color:var(--ui)}
.heat .bar{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.1)}
.heat .bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--hazard)}
#menuBtn{pointer-events:auto;margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:var(--panel);color:var(--ui);display:grid;place-items:center;cursor:pointer;padding:0}
#menuBtn:focus-visible,.mrow button:focus-visible,.mbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#menuBtn svg{width:20px;height:20px}
#goal{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:var(--panel);border:1px solid rgba(245,197,24,.35);color:var(--ui);border-radius:14px;padding:7px 12px;font-size:13px;font-weight:700;text-align:center;pointer-events:none;transition:opacity .4s}
#goal span{color:var(--hazard)}
#goal small{display:block;color:var(--uidim);font-size:11px;font-weight:600;margin-top:2px}
#stat{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none;font-size:12px;font-weight:700;transition:opacity .4s;max-width:calc(100% - 24px);overflow:hidden}
#stat i{width:9px;height:9px;border-radius:50%;background:var(--steel);display:inline-block;flex:none}
#toast{position:absolute;left:50%;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,0) scale(.9);background:rgba(16,19,26,.92);border:2px solid var(--hazard);border-radius:16px;padding:10px 16px;font-weight:800;font-size:16px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:80%}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.big{border-color:var(--good);font-size:20px}
#stage.intro .hud,#stage.intro #goal,#stage.intro #stat{opacity:0}
#menu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;width:min(290px,calc(100% - 24px));box-sizing:border-box;background:#10131a;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:6px 14px 12px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:none;z-index:5;font-size:14px}
#menu.on{display:block}
#menu h2{font-size:15px;margin:8px 0 4px;font-weight:800}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);min-height:44px}
.mrow:last-child{border-bottom:0}
.dest{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 0}
.dest .mbtn{min-width:0}
.dest .mbtn[aria-checked="true"]{background:var(--good);color:#0c1a12;border-color:transparent}
.dest .mbtn:disabled{opacity:.35;cursor:not-allowed}
.dinfo{font-size:12px;opacity:.75;padding:2px 0 6px;font-variant-numeric:tabular-nums}
.mrow[hidden]{display:none}
.mbtn{min-height:40px;min-width:76px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#232833;color:var(--ui);font:inherit;font-weight:800;cursor:pointer;padding:0 12px}
.mbtn[aria-pressed="true"]{background:var(--good);color:#0c1a12;border-color:transparent}
.mbtn.warn{background:transparent;color:var(--danger);border-color:rgba(255,107,90,.5)}
.mbtn.warnf{background:var(--danger);color:#1a0b08;border-color:transparent}
.mbtn.go{background:var(--hazard);color:#111;border-color:transparent}
.plist{font-size:12px;color:var(--uidim);display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:4px 0 6px;font-variant-numeric:tabular-nums}.plist b{color:var(--ui);font-weight:700;text-align:right}.plist .lk{opacity:.45}
#menu{max-height:calc(100% - 90px);overflow-y:auto;overscroll-behavior:contain}
.mrow .tg{min-width:96px}
#stats{font-size:12px;color:var(--uidim);line-height:1.6;padding:4px 0 6px}
#stats b{color:var(--ui);font-weight:700}
#modal{position:absolute;inset:0;background:rgba(5,7,10,.6);display:none;align-items:center;justify-content:center;z-index:6;padding:16px;box-sizing:border-box}
#modal.on{display:flex}
#modal .box{background:#10131a;border:2px solid var(--hazard);border-radius:18px;padding:16px;max-width:320px;text-align:center;max-height:100%;overflow-y:auto;box-sizing:border-box}
#modal.start .box{max-width:360px;text-align:left}#modal.start p{color:var(--ui);font-size:14.5px;line-height:1.5}#modal.start p b{color:var(--hazard)}#modal.start h2{color:var(--hazard)}#modal.start .btns{justify-content:flex-end}#modal .btns button[hidden]{display:none}
#modal h2{margin:0 0 6px;font-size:18px}#modal p{margin:0 0 14px;color:var(--uidim);font-size:14px;line-height:1.45}#modal p b{color:var(--ui)}
#modal .btns{display:flex;gap:10px;justify-content:center}

.heat{flex-direction:column;align-items:flex-start;gap:0;padding:5px 12px 8px;line-height:1.15;min-width:0;flex:0 1 auto;overflow:hidden}
.heat span#cv{font-size:9.5px;color:var(--uidim);font-weight:700}.heat b{font-size:11.5px;max-width:136px;overflow:hidden;text-overflow:ellipsis}
.heat{align-items:stretch;padding-left:9px;padding-right:9px}.heat span#cv,.heat b{display:block;overflow:hidden;text-overflow:ellipsis}
#st{min-width:0;white-space:normal;line-height:1.25}
#mapBtn{pointer-events:auto;margin-left:auto;position:relative;width:52px;height:44px;border-radius:22px;border:0;background:var(--hazard);color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;padding:0;font:inherit;font-size:8.5px;font-weight:800;flex:none}
#mapBtn svg{width:19px;height:19px}#mapBtn i{position:absolute;right:2px;top:1px;width:10px;height:10px;border-radius:50%;background:var(--danger);display:none;box-shadow:0 0 0 2px var(--frame)}#mapBtn.bad i{display:block}
#mapBtn:focus-visible,#craneBtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#menuBtn{margin-left:0;flex:none}
#goal{min-width:min(300px,calc(100% - 24px))}
#gbar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin:5px 4px 0;overflow:hidden}#gbar i{display:block;height:100%;width:0;background:var(--hazard);border-radius:3px}#gbar[hidden]{display:none}
#gs:empty{display:none}
#craneBtn{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);min-height:48px;border-radius:16px;border:2px solid var(--hazard);background:var(--panel2);color:var(--hazard);font:inherit;font-weight:800;font-size:14px;padding:0 16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#craneBtn.on{background:var(--hazard);color:#111}#craneBtn[hidden]{display:none}
#stage.intro #craneBtn,#stage.intro #mapBtn{opacity:0}
#mapov{position:absolute;inset:0;background:#090b0f;z-index:7;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);box-sizing:border-box;gap:8px}
#mapov.on{display:flex}
.mtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mtop h2{margin:0;font-size:18px;font-weight:800;margin-right:auto}
.seg{display:flex;gap:6px}.seg .mbtn{min-width:0;font-size:12.5px;padding:0 10px}
.msum{font-size:12.5px;color:var(--uidim);font-variant-numeric:tabular-nums}.msum b{color:var(--ui)}.msum .bad{color:var(--danger)}
.mwrap{position:relative;flex:1 1 auto;min-height:150px;display:flex;min-width:0}
.mzoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}.mzoom button{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(27,32,41,.92);color:var(--ui);font:inherit;font-size:20px;font-weight:800;cursor:pointer;padding:0;line-height:1}.mzoom button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.mzoom button:disabled{opacity:.35}
.mscroll{flex:1 1 auto;min-width:0;min-height:0;overflow:auto;cursor:grab;overscroll-behavior:contain;border-radius:12px;background:#0f1218;border:1px solid rgba(255,255,255,.08);-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.mscroll svg{display:block;height:100%;width:auto;max-width:none;min-height:240px}
@media (min-aspect-ratio:4/3){#mapov.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,36%);grid-template-rows:auto auto minmax(0,1fr)}.mtop,.msum{grid-column:1/-1}.mwrap{grid-row:3;min-height:0}.mpanel{grid-row:3;max-height:none;min-height:0}.mscroll svg{min-height:0}}
.mscroll .node{cursor:pointer}.mscroll .node.sel .nb{stroke:var(--hazard);stroke-width:2.5}.mscroll .node:focus{outline:none}.mscroll .node:focus-visible .nb{stroke:var(--hazard);stroke-width:3}
.mscroll .flow{animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.mscroll .pulse{animation:pul 1.4s ease-in-out infinite}@keyframes pul{50%{opacity:.35}}
.mpanel{flex:0 0 auto;max-height:42%;overflow-y:auto;overscroll-behavior:contain;background:#11141a;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.mpanel h3{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flag{font-size:10.5px;font-weight:800;letter-spacing:.04em;background:var(--danger);color:#1a0b08;border-radius:6px;padding:2px 7px}.flag.amb{background:var(--hazard);color:#111}.flag.ok{background:var(--good);color:#0c1a12}
.prow{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07)}
.prow .k{color:var(--uidim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.prow ul{margin:0;padding:0;list-style:none}.prow li{display:flex;gap:6px;align-items:center}.prow li i{width:10px;height:10px;border-radius:3px;flex:none}
.prow .lv{display:grid;grid-template-columns:1fr auto;gap:1px 10px}.prow .lv b{font-weight:700;text-align:right}.prow .lv .mx{color:var(--good)}.prow .lv .lk{opacity:.45}.prow .lv .urg{font-style:normal;font-size:10px;font-weight:800;color:var(--danger);text-transform:uppercase}
.util{height:7px;border-radius:4px;background:#232833;overflow:hidden;margin-top:5px}.util i{display:block;height:100%;background:var(--good)}
.pnote{font-size:12.5px;color:var(--uidim);margin:6px 0 0}
/* tap-to-explain bubble: dark panel, hazard border; placed above or below the play area, whichever is farther from the object */
#info{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:min(88%,440px);box-sizing:border-box;background:var(--panel2);border:2px solid var(--hazard);border-radius:16px;padding:10px 14px 11px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:4;pointer-events:none;font-size:13.5px;line-height:1.4;display:none}
#info.on{display:block}
#info b{display:block;font-size:15px;font-weight:800;color:var(--hazard);margin:0 0 3px}
#info p{margin:0;color:var(--ui);font-weight:500}
#info p.n{margin-top:6px;color:var(--uidim);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
#info p.n:empty{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function applyLangDom(){try{for(const e of document.querySelectorAll('[data-i]'))e.textContent=t_(e.dataset.i);for(const e of document.querySelectorAll('[data-ia]'))e.setAttribute('aria-label',t_(e.dataset.ia));
 document.documentElement.lang=NO_()?'nb':'en';$('cur').hidden=!NO_()}catch(e){}}
/* switch language at once: DOM, HUD caches, cached canvas labels, the baked floor (zone plates), menu, map, info bubble */
function setLang(l){if(l!=='en'&&l!=='no')return;LANG=l;try{localStorage.setItem('molten.lang',l)}catch(e){}
 applyLangDom();for(const k in lastHud)delete lastHud[k];gCache={};hudT=0;for(const k in LABC)delete LABC[k];

/* ---------- audio ---------- */
const AU={ac:null,m:null,hum:null,cr:null,roar:null,lastCoin:0,nb:null};
function initAudio(){
 if(AU.ac){if(AU.ac.state==='suspended')AU.ac.resume().catch(()=>{});return}
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC();AU.ac=ac;
  AU.m=ac.createGain();AU.m.gain.value=S.mute?0:.7;AU.m.connect(ac.destination);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=nb;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;AU.hum=ac.createGain();AU.hum.gain.value=0;
  const o1=ac.createOscillator();o1.type='sawtooth';o1.frequency.value=50;const o2=ac.createOscillator();o2.type='square';o2.frequency.value=100;
  const g2=ac.createGain();g2.gain.value=.35;o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(AU.hum);AU.hum.connect(AU.m);o1.start();o2.start();
  const n1=ac.createBufferSource();n1.buffer=nb;n1.loop=true;const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=2200;AU.cr=ac.createGain();AU.cr.gain.value=0;n1.connect(hp);hp.connect(AU.cr);AU.cr.connect(AU.m);n1.start();
  const n2=ac.createBufferSource();n2.buffer=nb;n2.loop=true;n2.playbackRate.value=.7;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=380;bp.Q.value=.6;AU.roar=ac.createGain();AU.roar.gain.value=0;n2.connect(bp);bp.connect(AU.roar);AU.roar.connect(AU.m);n2.start();
 }catch(e){AU.ac=null}}
function blip(f0,f1,d,type,v,delay){if(!AU.ac||S.mute)return;try{const ac=AU.ac,t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(max(20,f1),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,f,v,q){if(!AU.ac||S.mute)return;try{const ac=AU.ac,t=ac.currentTime,s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain();s.buffer=AU.nb;b.type='bandpass';b.frequency.value=f;b.Q.value=q||1;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(b);b.connect(g);g.connect(AU.m);s.start(t,Math.random());s.stop(t+d+.02)}catch(e){}}
function sfx(n,k){k=k||0;switch(n){
 case'pop':blip(380+k*45,760+k*45,.07,'sine',.16);break;
 case'drop':blip(240,130,.08,'square',.05);noise(.06,1200,.08,2);break;
 case'clank':noise(.14,900,.18,3);blip(160,90,.1,'triangle',.08);break;
 case'coin':{const now=performance.now();if(now-AU.lastCoin<60)return;AU.lastCoin=now;blip(1320,1320,.06,'triangle',.11);blip(1980,1980,.14,'triangle',.09,.05);break}
 case'tick':blip(880+k,880+k,.03,'square',.025);break;
 case'buy':[523,659,784,1047].forEach((f,i)=>blip(f,f,.16,'triangle',.13,i*.07));break;
 case'tap':blip(90,38,.9,'sawtooth',.22);noise(.8,300,.35,.7);break;
 case'ready':blip(660,880,.22,'square',.06);blip(660,880,.22,'square',.06,.28);break;
 case'level':[392,523,659,784].forEach((f,i)=>blip(f,f*1.01,.2,'sine',.12,i*.09));break;
 case'mile':[523,659,784,1047,1319].forEach((f,i)=>blip(f,f,.22,'triangle',.13,i*.08));break}}
function setLoops(){if(!AU.ac)return;const t=AU.ac.currentTime;let arc=0,roar=0;
 {const d=hyp(P.x-F.x,P.y-F.y),k=clamp(1.2-d/700,0,1);arc=F.arc*k;if(F.state==='tapping'&&F.tapT>.6&&F.tapT<3.4)roar=.32*k;if(PIT.state==='pour'){const d2=hyp(P.x-POS.pit.x,P.y-POS.pit.y);roar=max(roar,.26*clamp(1.2-d2/600,0,1))}}
 if(S.mute){arc=0;roar=0}
 AU.hum.gain.setTargetAtTime(.05*arc,t,.08);AU.cr.gain.setTargetAtTime(arc>0?(Math.random()<.35?.09*arc:.012*arc):0,t,.02);AU.roar.gain.setTargetAtTime(roar,t,.15)}
const buzz=ms=>{if(!S.vib)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};


/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r,c){c=c||ctx;r=min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(x,y,r,c){c=c||ctx;c.beginPath();c.arc(x,y,r,0,TAU)}
function ell(x,y,a,b,c){c=c||ctx;c.beginPath();c.ellipse(x,y,a,b,0,0,TAU)}
function shadow(x,y,a,b,al){ctx.fillStyle=`rgba(0,0,0,${al||.3})`;ell(x,y,a,b);ctx.fill()}
function block(x,y,w,h,d,top,side,r){r=r==null?6:r;ctx.fillStyle='rgba(0,0,0,.3)';rr(x+5,y+7,w,h,r);ctx.fill();ctx.fillStyle=side;rr(x,y,w,h,r);ctx.fill();ctx.fillStyle=top;rr(x,y-d,w,h,r);ctx.fill()}
function txt(t,x,y,s,c,w,al,stroke){ctx.font=`${w||800} ${s}px ${FONT}`;ctx.textAlign=al||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle='rgba(10,12,16,.85)';ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=c;ctx.fillText(t,x,y)}
function hazPat(c){const h=document.createElement('canvas');h.width=h.height=16;const g=h.getContext('2d');g.fillStyle=C.hazard;g.fillRect(0,0,16,16);g.fillStyle=C.ink;g.beginPath();g.moveTo(0,0);g.lineTo(8,0);g.lineTo(0,8);g.fill();g.beginPath();g.moveTo(16,0);g.lineTo(16,8);g.lineTo(8,16);g.lineTo(0,16);g.fill();return c.createPattern(h,'repeat')}
const HZ=hazPat(ctx);
const SHAPES=[];for(let k=0;k<8;k++){const r=seeded(k*977+13),n=6+(k%3),pts=[];for(let i=0;i<n;i++){const a=i/n*TAU+r()*.5,d=.6+r()*.5;pts.push([Math.cos(a)*d*1.25,Math.sin(a)*d*.75])}SHAPES.push(pts)}
function poly(p,dy){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]+dy):ctx.moveTo(q[0],q[1]+dy));ctx.closePath()}
function drawScrap(x,y,s,k,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(s,s);const p=SHAPES[k&7];
 poly(p,.35);ctx.fillStyle=C.rust;ctx.fill();poly(p,0);ctx.fillStyle=k%3?C.scrap:C.steeld;ctx.fill();ctx.lineWidth=.1;ctx.strokeStyle=k%2?C.steell:'#8a7c70';ctx.stroke();ctx.restore()}
function drawSlag(x,y,s,k){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const p=SHAPES[(k||0)&7];poly(p,.3);ctx.fillStyle='#1f1d1b';ctx.fill();poly(p,0);ctx.fillStyle=C.slag;ctx.fill();ctx.fillStyle='rgba(255,255,255,.12)';circ(-.3,-.2,.25);ctx.fill();ctx.fillStyle='#2b2826';circ(.3,.15,.18);ctx.fill();ctx.restore()}
/* long square bar: billet (light) / bloom (heavier, darker) */
function drawBillet(x,y,hot,w,k){w=w||24;const bl=k==='bloom',hh=bl?7:5;ctx.fillStyle=hot>0?mix('#4a4f57',C.moltend,hot):bl?'#3a3631':'#3e434b';ctx.fillRect(x-w/2,y-1,w,hh+1);ctx.fillStyle=hot>0?mix(C.steel,C.molten,hot):bl?'#7d7468':C.steel;ctx.fillRect(x-w/2,y-hh,w,hh);ctx.fillStyle=hot>0?mix(C.steell,C.moltenhi,hot):bl?'#a3998b':C.steell;ctx.fillRect(x-w/2,y-hh,w,1.5)}
/* ingot lying down: tapered block, hot-top (head) on the wide end */
function drawIngot(x,y,s,hot){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.moveTo(-11,-3);ctx.lineTo(11,-5);ctx.lineTo(11,8);ctx.lineTo(-11,6);ctx.fill();
 ctx.fillStyle=hot>0?mix('#3b3530',C.moltend,hot):'#3b3530';ctx.beginPath();ctx.moveTo(-12,-2);ctx.lineTo(10,-4);ctx.lineTo(10,5);ctx.lineTo(-12,4);ctx.fill();
 ctx.fillStyle=hot>0?mix('#6c6a66',C.molten,hot):'#6c6a66';ctx.beginPath();ctx.moveTo(-12,-6);ctx.lineTo(10,-9);ctx.lineTo(10,1);ctx.lineTo(-12,0);ctx.fill();
 ctx.fillStyle=hot>0?mix('#8f8b84',C.moltenhi,hot):'#8f8b84';ctx.fillRect(-12,-6,22,1.4);
 ctx.fillStyle=hot>0?mix('#4b4440',C.molten,hot):'#4b4440';ctx.fillRect(7,-9,3,10);ctx.restore()}

/* ---------- drawing kit ported from the approved sketch (skisse_v5): every function takes the context first ---------- */
const SK=(()=>{const F=(w,s)=>`${w} ${s}px ${FONT}`;
const HEAT=['#3f4248','#4a2e26','#7a2a12','#b8400e','#ff6a00','#ffb030','#ffe7a6'];

/* ================= drawing helpers ================= */
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function shadow(g,x,y,rx,ry,a){g.fillStyle=`rgba(0,0,0,${a==null?.3:a})`;ell(g,x,y,rx,ry);g.fill()}
function box(g,x,y,w,h,fill,edge,r){g.fillStyle=fill;rr(g,x,y,w,h,r==null?2:r);g.fill();if(edge){g.strokeStyle=edge;g.lineWidth=1;rr(g,x+.5,y+.5,w-1,h-1,r==null?2:r);g.stroke()}}
function txt(g,s,x,y,size,col,w,al){g.font=F(w||700,size);g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y)}

/* stateless particles: fn(f 0..1 life, a, b, i) */
function parts(n,rate,seed,t,fn){for(let i=0;i<n;i++){const ph=t*rate+i/n,k=Math.floor(ph);fn(ph-k,hsh(seed+i*13.1+k*7.7),hsh(seed+i*3.3+k*1.9),i)}}

/* pipe on supports, optional animated flow dashes */
function pipe(g,p,w,col,t,o){o=o||{};g.lineJoin='round';g.lineCap=o.cap||'round';
  g.save();g.translate(1.5,2.5);pathPts(g,p);g.strokeStyle='rgba(0,0,0,.32)';g.lineWidth=w+2;g.stroke();g.restore();
  pathPts(g,p);g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=w+2;g.stroke();
  pathPts(g,p);g.strokeStyle=col;g.lineWidth=w;g.stroke();
  pathPts(g,p);g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=Math.max(.8,w*.28);g.stroke();
  if(o.flow){g.setLineDash(o.dash||[Math.max(2,w*.8),Math.max(5,w*2.2)]);g.lineDashOffset=RM?0:-(t*(o.speed||28));pathPts(g,p);g.strokeStyle=o.flow;g.lineWidth=Math.max(1.2,w*.42);g.stroke();g.setLineDash([])}
  g.lineCap='butt'}
function hose(g,x1,y1,cx,cy,x2,y2,w,col,t,flow){g.lineCap='round';const P=()=>{g.beginPath();g.moveTo(x1,y1);g.quadraticCurveTo(cx,cy,x2,y2)};
  P();g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=w+2;g.stroke();P();g.strokeStyle=col;g.lineWidth=w;g.stroke();
  if(flow){g.setLineDash([2,5]);g.lineDashOffset=RM?0:-t*24;P();g.strokeStyle=flow;g.lineWidth=Math.max(1,w*.5);g.stroke();g.setLineDash([])}g.lineCap='butt'}
/* conveyor belt in local frame (x along belt) */
function belt(g,x1,y1,x2,y2,w,t,o){o=o||{};const L=Math.hypot(x2-x1,y2-y1),a=Math.atan2(y2-y1,x2-x1);g.save();g.translate(x1,y1);g.rotate(a);

function chunk(g,x,y,s,a,col){g.save();g.translate(x,y);g.rotate(a*PI);g.fillStyle=col;g.fillRect(-s,-s*.42,s*2,s*.84);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(-s,s*.12,s*2,s*.3);g.restore()}

function ladle(g,x,y,r,t,o){o=o||{};shadow(g,x+r*.14,y+r*.22,r*1.08,r*.98,.35);g.save();g.translate(x,y);g.rotate(o.rot||0);

  else if(f>.02){const gr=g.createRadialGradient(-r*.2,-r*.2,r*.05,0,0,r*.76);gr.addColorStop(0,mix('#6b3a20','#ffe39a',f));gr.addColorStop(.6,mix('#4a2a1a','#ff8a20',f));gr.addColorStop(1,mix('#3a2418','#b8400e',f));g.fillStyle=gr;circ(g,0,0,r*.76);g.fill();
    for(let i=0;i<8;i++){const a=i*.8+(RM?0:t*.12),rr2=r*(.25+.4*hsh(i+2));g.fillStyle=`rgba(90,72,60,${.55*f})`;ell(g,Math.cos(a)*rr2,Math.sin(a)*rr2,r*.17,r*.09,a);g.fill()}
    if(o.eye!==false){const p=RM?.7:.6+.4*Math.sin(t*3.2);const gr2=g.createRadialGradient(r*.22,-r*.12,0,r*.22,-r*.12,r*.24*p);gr2.addColorStop(0,'rgba(255,250,220,.95)');gr2.addColorStop(1,'rgba(255,200,90,0)');g.fillStyle=gr2;circ(g,r*.22,-r*.12,r*.26);g.fill()}}

 up:{

  charge:['Mer plass til skrap ved ovnen: større skrapkasse (konverter), flere chargeringskasser (SM-ovn), større skrapkurv (lysbueovn) eller raskere Consteel-bånd.','More room for scrap at the furnace: a bigger scrap box (converter), more charging boxes (open hearth), a bigger scrap bucket (arc furnace) or a faster Consteel belt.'],
  magnet:['Større løftemagnet på chargeringskranen (Consteel): hvert nivå løfter mer skrap per tur.','A bigger lifting magnet on the charging crane (Consteel): each level lifts more scrap per trip.'],

  power:['Raskere smelting eller blåsing: sterkere blåsemaskin (Bessemer), sterkere brennere (SM-ovn), kraftigere O₂-lanse (LD) eller mer transformatoreffekt (lysbueovn).','Faster melting or blowing: a stronger blowing engine (Bessemer), stronger burners (open hearth), a stronger O₂ lance (LD) or more transformer power (arc furnace).'],
  refine:['Kortere tid fra smeltet bad til stål som er klart til tapping: prøvetaking, temperatur og analyse går raskere.','Less time from a melted bath to steel that is ready to tap: sampling, temperature and analysis go faster.'],
  operator:['En tapper ved pulten ved TAPP. Han tapper hver charge for deg, så du slipper å gå dit.','A furnace tapper at the desk next to TAP. He taps every heat for you, so you don’t have to walk there.'],
  ladle:['En øse til i omløp. Mens én øse støpes eller behandles, kan neste stå klar under tappen.','One more ladle in circulation. While one ladle is casting or being treated, the next can wait under the tap.'],
  slagcap:['Slaggpotta rommer mer før den må tømmes. Full potte stopper ovnen. En større potte gir også litt mer betalt for slagget.','The slag pot holds more before it must be emptied. A full pot stops the furnace. A bigger pot also earns a little more for the slag.'],
  slaggbil:['En slaggbil henter den fulle slaggpotta og tømmer den på slaggplassen av seg selv. Slagget selges som pukk.','A slag pot carrier picks up the full pot and empties it at the slag yard by itself. The slag is sold as aggregate.'],
  kalk:['Brent kalk og dolomitt danner slagget som tar opp fosfor og svovel og beskytter ovnsforingen. Ovnen kan ikke smelte raskere enn kalkanlegget leverer.','Burnt lime and dolomite form the slag that takes up phosphorus and sulphur and protects the furnace lining. The furnace can’t melt faster than the lime plant delivers.'],
  o2:['Et luftseparasjonsanlegg lager rent oksygen. LD-konverteren blåser det inn i råjernet; lysbueovnen bruker det til å skjære skrap og brenne av karbon.','An air separation plant makes pure oxygen. The LD converter blows it into the hot metal; the arc furnace uses it to cut scrap and burn off carbon.'],
  lans:['Dørlansemanipulatoren, og senere veggmonterte injektorer, blåser oksygenet mer effektivt inn i badet: mer O₂-kapasitet.','A door lance manipulator, and later wall-mounted injectors, blow the oxygen into the bath more efficiently: more O₂ capacity.'],
  elekkran:['Lysbueovnen bruker opp grafittelektrodene. Elektrodekranen skjøter på nye fra lageret av seg selv.','The arc furnace burns up its graphite electrodes. The electrode crane adds new ones from the store by itself.'],
  kull:['Kullpulver blåses inn i slagget. Gassen lager skumslagg som skjermer lysbuen, så mer av energien går til stålet.','Powdered coal is injected into the slag. The gas makes a foaming slag that shields the arc, so more of the energy goes into the steel.'],
  rjsize:['Større masovn gir mer råjern per minutt – med el-råjernsovnen gir hvert nivå mer transformatoreffekt (MVA).','A bigger blast furnace makes more hot metal per minute – with the electric smelter each level adds transformer power (MVA).'],

  skip:['Skipet er vogna som drar malmen opp skråbanen til toppen av masovnen. Større skip (eller chargeringsbånd) rommer mer malm.','The skip is the car that hauls ore up the incline to the top of the blast furnace. A bigger skip (or charging belt) holds more ore.'],

  torpn:['En torpedovogn til, så én kan fylles mens en annen tømmes i stålverket.','One more torpedo car, so one can fill while another empties at the melt shop.'],

  bjelke:['En bjelkeovn (walking beam) løfter emnene trinnvis gjennom ovnen og varmer dem jevnt fra alle sider.','A walking-beam furnace lifts the billets step by step through the furnace and heats them evenly from all sides.'],

  ore:['Jernmalm: jernoksid som må reduseres med koks i masovnen for å bli jern.','Iron ore: iron oxide that has to be reduced with coke in the blast furnace to become iron.'],

  slag:['Slagg: kalk og oksider som flyter oppå stålet. Den tømmes i slaggpotta og selges knust som pukk.','Slag: lime and oxides floating on top of the steel. It is tipped into the slag pot and sold crushed as aggregate.'],
  elek:['Grafittelektroder fører strømmen inn i lysbueovnen og brennes langsomt opp.','Graphite electrodes carry the current into the arc furnace and slowly burn away.'],
  kokk:['Kokiller: tykke støpejernsformer som stålet størkner i.','Ingot moulds: thick cast-iron moulds that the steel solidifies in.'],
  kokv:['Varme kokiller rett fra strippingen. De må kjøles i kokillelageret før de kan brukes igjen.','Hot moulds straight from stripping. They must cool in the mould store before they can be used again.'],
  kanal:['Kanalstein: ildfaste rør som leder stålet fra trakten under bunnplata og opp i kokillene.','Runner bricks: refractory tubes that lead the steel from the trumpet under the plate up into the moulds.'],
  hette:['Varmholdsmasse: isolerende pulver som holder toppen av blokka flytende lenger, så krympehulrommet havner i toppen som kappes.','Hot-top compound: insulating powder that keeps the top of the ingot liquid longer, so the shrinkage cavity ends up in the top that is cut off.'],
  ingot:['Støpeblokk: stål støpt i kokille. Når stranggjutingen er bygd, blir blokkene små serier spesialstål med høyere pris.','Ingot: steel cast in a mould. Once the caster is built, ingots become small special-steel batches with a higher price.'],
  billet:['Emne: kvadratisk stålstang fra stranggjutingen – råvaren til valseverket.','Billet: a square steel bar from the continuous caster – the feedstock for the rolling mill.'],
  rebar:['Armeringsstål: ribbede stenger som gjør betongen sterk på strekk.','Rebar: ribbed bars that give concrete its tensile strength.'],
  tcore:['Tempcore-armering: herdet overflate og seig kjerne – sterk og sveisbar.','Tempcore rebar: a quenched skin and a tough core – strong and weldable.'],
  coil:['Valstråd: tynn tråd i store ringer, til nett, spiker og trådprodukter.','Wire rod: thin rod in big coils, for mesh, nails and wire products.'],
  mesh:['Armeringsnett: sveisede rutenett til gulv og vegger i betong.','Rebar mesh: welded grids for concrete floors and walls.'],
  bent:['Bøyd armering: kappet og bøyd etter tegning, klar til å legges i forskalingen.','Bent rebar: cut and bent to the drawing, ready to place in the formwork.']},
 era:[
  ['Bessemer-konverteren (oppfunnet 1856) blåser luft gjennom flytende råjern. Forbrenningen av karbon og silisium gir all varmen – ingen brensel. Her: råjern og litt kjøleskrap inn, blås, og tipp for tapping.','The Bessemer converter (invented 1856) blows air through liquid hot metal. Burning off carbon and silicon gives all the heat – no fuel. Here: hot metal and a little cooling scrap go in, it blows, then tilts to tap.'],
  ['Siemens-Martin-ovnen (1860-årene) fyres med forvarmet gass og luft og kan smelte mye skrap; en charge tar timer. Her: skrap og råjern i kasser, og den trenger kalk.','The open-hearth (Siemens-Martin) furnace (1860s) is fired with preheated gas and air and can melt plenty of scrap; a heat takes hours. Here: scrap and hot metal in boxes, and it needs lime.'],
  ['LD-konverteren (1952) blåser rent oksygen ovenfra gjennom en lanse. Rundt 40 minutter per charge, 75–85 % råjern og resten skrap. Trenger kalk og oksygen.','The LD (BOF) converter (1952) blows pure oxygen from above through a lance. About 40 minutes per heat, 75–85% hot metal and the rest scrap. Needs lime and oxygen.'],
  ['Lysbueovnen smelter skrap med lysbuer fra tre grafittelektroder – uten råjern. Her: skrapkurv, strøm, kalk og oksygen.','The electric arc furnace melts scrap with arcs from three graphite electrodes – no hot metal needed. Here: scrap bucket, power, lime and oxygen.'],
  ['UHP-lysbueovnen (ultrahøy effekt) har vannkjølte paneler, stor transformator, oksygenlanser og kullinjeksjon for skumslagg. Under en time fra tapping til tapping.','The UHP (ultra-high power) arc furnace has water-cooled panels, a big transformer, oxygen lances and coal injection for foaming slag. Under an hour from tap to tap.'],
  ['Consteel: skrapet mates kontinuerlig gjennom en forvarmingstunnel rett i et flatt bad. Rundt 45 % av stålet blir igjen i ovnen (varm rest), så skrapet smelter ved å synke i flytende stål. Taket er lukket, lysbuen er dekket av skumslagg, og den varme resten gjør drifta jevn med lite flimmer. Tappes gjennom bunnen (EBT).','Consteel: scrap is fed continuously through a preheating tunnel straight into a flat bath. About 45% of the steel stays in the furnace (the hot heel), so the scrap melts by sinking into liquid steel. The roof stays closed, the arc is buried in foaming slag, and the hot heel keeps the running steady with little flicker. Tapped through the bottom (EBT).']],
 rje:[
  ['Masovnen: malm, koks og kalk chargeres på toppen, og varm blåst blåses inn nederst. Koksen brenner og reduserer malmen til flytende råjern med rundt 4 % karbon.','The blast furnace: ore, coke and limestone go in at the top, hot blast is blown in at the bottom. The coke burns and reduces the ore to liquid hot metal with about 4% carbon.'],
  ['Elektrisk råjernsovn: tre Söderberg-elektroder gir varmen, og koksen er bare reduksjonsmiddel. Ingen cowpere – mer effekt (MVA) gir mer råjern.','Electric pig-iron furnace: three Söderberg electrodes supply the heat and the coke is only the reducing agent. No hot stoves – more power (MVA) gives more iron.']],
 drop:{
  conv:['Skrapkasse: skrap til konverteren. Bessemer tar bare litt kjøleskrap; LD tar rundt en femtedel skrap.','Scrap box: scrap for the converter. Bessemer only takes a little cooling scrap; LD takes about one fifth scrap.'],
  box:['Chargeringskasser: skrapet lastes i kasser som chargeringsmaskinen tømmer inn gjennom ovnsdørene.','Charging boxes: scrap is loaded into boxes that the charging machine tips in through the furnace doors.'],
  bucket:['Skrapkurv: kranen løfter kurven over ovnen, taket svinges til side og skrapet slippes ned.','Scrap bucket: the crane lifts the bucket over the furnace, the roof swings aside and the scrap drops in.'],
  belt:['Sjakt ned på chargeringsseksjonen: skrap som bæres hit, havner på Consteel-transportøren. Chargeringskranen gjør jobben av seg selv.','A chute onto the charging section: scrap carried here ends up on the Consteel conveyor. The charging crane does this job by itself.']},

  rjsale:['Salg ved malmtoget','Her selges masseljern.','Sale at the ore train','Pig iron is sold here.'],
  rack:['Elektrodestativ','Lysbueovnen bruker opp elektroder. Er stativet tomt, blir lysbuen svak og ovnen smelter saktere.','Electrode rack','The arc furnace uses up electrodes. With an empty rack the arc is weak and the furnace melts slower.'],
  plate:['Bunnplate','Sett kokiller her, pluss kanalstein og varmholdsmasse. Stålet stigstøpes opp i kokillene.','Bottom plate','Put moulds here, plus runner bricks and hot-top compound. The steel is bottom-poured up into the moulds.'],

  slagp:['Slaggplass','Tøm slaggpotta her. Slagget selges som pukk.','Slag yard','Empty the slag pot here. The slag is sold as aggregate.'],
  bil1:['Lastebil','Kjøper alle produkter til prisen i salgsavtalen.','Truck','Buys every product at the sales-contract price.'],

  tog:['Tog','Toget betaler mer per tonn enn lastebilen.','Train','The train pays more per tonne than the truck.'],
  kai:['Kai','Skipet ved kaia betaler best, for eksport.','Quay','The ship at the quay pays the best price, for export.'],
  gjvIn:['Innmating: emner','Legg emner her, så går de inn i gjennomvarmingsovnen.','Feed: billets','Drop billets here and they go into the reheating furnace.'],

  y0:['Skraphaug','Fylles av skrapleveransene. Hent skrap her.','Scrap pile','Refilled by scrap deliveries. Pick up scrap here.'],
  y1:['Skraphaug 2','Fylles av skrapleveransene. Hent skrap her.','Scrap pile 2','Refilled by scrap deliveries. Pick up scrap here.'],
  ore:['Malmlager','Malmtoget tipper malm her. Hent malm til skipet.','Ore yard','The ore train tips ore here. Take ore to the skip.'],
  st_elek:['Elektrodelager','Nye grafittelektroder. Bær dem til elektrodestativet ved ovnen.','Electrode store','New graphite electrodes. Carry them to the electrode rack by the furnace.'],
  st_kanal:['Kanalsteinlager','Ferdige kanalsteiner. Bær dem til bunnplata.','Runner-brick store','Ready-made runner bricks. Carry them to the bottom plate.'],
  st_hette:['Varmholdsmasse','Sekker med varmholdsmasse. Bær dem til bunnplata.','Hot-top compound','Bags of hot-top compound. Carry them to the bottom plate.'],
  kokv:['Varme kokiller','Kokiller rett fra strippingen. Bær dem til kokillelageret for å kjøles.','Hot moulds','Moulds straight from stripping. Carry them to the mould store to cool.'],
  pot:['Slaggpotte','Fylles med slagg mens ovnen smelter. Full potte stopper ovnen!','Slag pot','Fills with slag while the furnace melts. A full pot stops the furnace!']},

 misc:{
  torp:['Torpedovogn','Isolert jernbanevogn som frakter rundt 1450 °C varmt råjern fra masovnen til stålverket.','Torpedo car','An insulated rail car that carries hot metal at about 1450 °C from the blast furnace to the melt shop.'],
  ladle:['Støpeøse','Stålkappe med ildfast foring. Den tar imot stålet fra ovnen, og kranen bærer den til øseovnen og støpingen.','Ladle','A steel shell with a refractory lining. It takes the steel from the furnace, and the crane carries it to the ladle furnace and to casting.'],
  hmL:['Råjernsøse','Torpedovogna heller råjernet i denne øsa, som så chargerer det i ovnen.','Hot-metal ladle','The torpedo car pours its iron into this ladle, which then charges it into the furnace.'],
  pigm:['Masseljernsmaskin','En kjede av små former. Råjern som ikke går til stålverket, støpes her til masseljern.','Pig casting machine','A chain of small moulds. Hot metal that doesn’t go to the melt shop is cast into pig iron here.'],
  train:['Malmtog','Malmtoget tipper jernmalm i malmlageret.','Ore train','The ore train tips iron ore into the ore yard.'],
  desk:['Operatørpult','Ledige hjelpere venter her når en kran eller rullebane gjør jobben deres, og går tilbake til bæring når det trengs.','Operator desk','Idle helpers wait here while a crane or conveyor does their job, and go back to carrying when needed.'],
  tapdesk:['Tapperpult','Her sitter tapperen og tapper ovnen for deg når den er klar.','Tapper’s desk','The tapper sits here and taps the furnace for you when it is ready.'],

 /* the continuous caster's machines, upstream to downstream */
 cast:{
  turret:['Øsetårn','Et dreibart tårn med to armer. Kranen setter den fulle øsa på den ledige armen bak. Når øsa over fordeleren er tom, svinger tårnet 180°, og neste øse støper uten stopp. Den tomme løftes av bak.','Ladle turret','A slewing turret with two arms. The crane sets the full ladle on the free arm at the back. When the ladle over the tundish is empty, the turret swings 180° and the next ladle casts without a stop. The empty one is lifted off at the back.'],
  shroud:['Skjermrør','Keramisk rør fra øsas glideluke ned i fordeleren. Det skjermer stålet mot lufta, så det ikke tar opp oksygen og nitrogen.','Ladle shroud','A ceramic tube from the ladle’s slide gate down into the tundish. It shields the steel from the air so it does not pick up oxygen and nitrogen.'],
  tundish:['Fordeler','Et ildfast foret trau med lokk, på en vogn. Det fordeler stålet jevnt til alle strengene og holder et jevnt nivå, så slagg og urenheter flyter opp. Det holder støpingen i gang mens tårnet bytter øse.','Tundish','A refractory-lined trough with a lid, on a car. It spreads the steel evenly to all strands and keeps a steady level so slag and inclusions float up. It keeps casting going while the turret changes ladles.'],
  mould:['Kokiller','Vannkjølte kobberrør, ett per streng. Stålet størkner til et skall mot kobberet, og kokilla oscillerer opp og ned så skallet ikke henger fast.','Moulds','Water-cooled copper tubes, one per strand. The steel freezes into a shell against the copper, and the mould oscillates up and down so the shell does not stick.'],
  spray:['Sekundærkjøling','Vanndyser spruter på strengen under kokilla til den er størknet helt inn. Dampen stiger opp av kammeret.','Spray chamber','Water nozzles spray the strand below the mould until it is solid all the way through. Steam rises from the chamber.'],
  wsu:['Uttrekk og retting','Drevne valsepar trekker strengen ut av kokilla med støpefarten og retter den ut fra buen til et rett emne.','Withdrawal and straightening','Driven roll pairs pull the strand out of the mould at casting speed and straighten it from the arc into a straight bar.'],
  cutter:['Kapping','Strengen kappes i emnelengder mens den går. En hydraulisk saks klipper den; en skjærebrenner kjører med strengen og brenner den av med mindre tap av stål.','Cutting','The moving strand is cut into billet lengths. A hydraulic shear chops it; a cutting torch travels with the strand and burns through with less steel lost.'],
  bed:['Kjøleseng','Hakkede bjelker flytter emnene steg for steg over senga mens de kjøles fra rødglødende til grå. Herfra går de til gjennomvarming eller salg.','Cooling bed','Notched beams walk the billets step by step across the bed while they cool from red-hot to grey. From here they go to reheating or to sale.']},
 /* the Consteel line: [Norwegian title, Norwegian text, English title, English text] */
 cs:{
  charge:['Chargeringsseksjon','Den åpne delen av Consteel-transportøren, langs skrapplassen. Magnetkranen legger skrapet i jevne løft over hele lengden, og laget kryper videre mot tunnelen.','Charging section','The open part of the Consteel conveyor, alongside the scrap yard. The magnet crane lays the scrap in even lifts over its whole length, and the layer creeps on toward the tunnel.'],
  conveyor:['Oscillerende transportør','Ikke et bånd på ruller, men et langt stålkar som ristes av en drivenhet: langsomt fram, raskt tilbake. Skrapet glir litt fram for hvert slag. Farten følger hvor fort ovnen smelter.','Oscillating conveyor','Not a belt on rollers but a long steel pan shaken by a drive unit: slowly forward, quickly back. The scrap slides a little further with every stroke. The speed follows how fast the furnace melts.'],
  seal:['Dynamisk tetning','Ved tunnelinngangen holder en vifte og tunge kjettinggardiner falsk luft ute, så avgassen ikke blandes med kald luft.','Dynamic seal','At the tunnel entry a fan and heavy chain curtains keep false air out, so the off-gas is not diluted with cold air.'],
  tunnel:['Forvarmingstunnel','Avgassen fra ovnen (rundt 1200 °C) strømmer tilbake gjennom tunnelen, mot skrapet. Skrapet blir varmt – mørkerødt mot ovnsenden – og trenger mindre strøm for å smelte. Raskere bånd gir kortere tid i tunnelen.','Preheating tunnel','The off-gas from the furnace (about 1200 °C) flows back through the tunnel, against the scrap. The scrap heats up – dull red toward the furnace end – and needs less electricity to melt. A faster conveyor means less time in the tunnel.'],
  inj:['Etterforbrenning','Seks injektorer blåser luft inn i tunnelen. CO i avgassen brenner til CO₂ og gir ekstra varme til skrapet. Lufta styres etter oksygenet i gassen ut av tunnelen.','Post-combustion','Six injectors blow air into the tunnel. The CO in the off-gas burns to CO₂ and gives the scrap extra heat. The air is set by the oxygen in the gas leaving the tunnel.'],
  duct:['Avgasskanal','Avgassen går ut i chargeringsenden av tunnelen – ikke gjennom ovnstaket – og opp en vannkjølt kanal til et utskillerkammer, der gnister og grovt støv faller ut.','Off-gas duct','The off-gas leaves at the charging end of the tunnel – not through the furnace roof – and goes up a water-cooled duct to a drop-out box, where sparks and coarse dust fall out.'],
  filter:['Posefilter og pipe','Gassen renses i et posefilter: støvet fanges på tekstilposer som blåses rene med trykkluftstøt. En sugevifte trekker gassen gjennom hele anlegget og ut i pipa.','Bag filter and stack','The gas is cleaned in a bag filter: the dust is caught on fabric bags that are cleaned by pulses of compressed air. An induced-draught fan pulls the gas through the whole plant and out of the stack.'],
  car:['Koblingsvogn','Den siste, teleskopiske delen av transportøren, på egen vogn. Den går inn gjennom en åpning i ovnsveggen, og skrapet faller rett i det flytende badet. Tuppen er den mest utsatte delen.','Connecting car','The last, telescopic part of the conveyor, on its own carriage. It runs in through an opening in the furnace shell, and the scrap drops straight into the liquid bath. Its tip is the hardest-worked part.'],
  door:['Slaggdør','Skumslagget renner hele tiden over terskelen i slaggdøra og ned i slagg-gropa. Oksygen og kull holder slagget skummende, så lysbuen er dekket.','Slag door','The foaming slag runs over the slag door sill all the time and down into the slag pit. Oxygen and carbon keep the slag foaming, so the arc stays covered.'],
  pit:['Slagg-grop','Slagget renner hit og stivner. En hjullaster tømmer gropa, og slagget selges som pukk. Full grop stopper ovnen!','Slag pit','The slag runs in here and solidifies. A wheel loader clears the pit, and the slag is sold as aggregate. A full pit stops the furnace!'],
  robot:['Temperaturrobot','Roboten henter en sonde med papphylse fra magasinet, skyver lansen inn gjennom slaggdøra og ned i badet i noen sekunder, leser temperaturen og slipper den brente sonden i en kasse.','Temperature robot','The robot takes a probe with a cardboard sleeve from the magazine, pushes the lance in through the slag door into the bath for a few seconds, reads the temperature and drops the burnt probe in a bin.'],
  crane:['Chargeringskran','Traverskran med stor løftemagnet. Den henter skrap i skrapplassen og legger løftene jevnt langs chargeringsseksjonen – ingen trenger å bære skrap. Du kan styre den selv for dobbel last.','Charging crane','An overhead crane with a big lifting magnet. It takes scrap from the yard and lays the lifts evenly along the charging section – nobody needs to carry scrap. Drive it yourself for a double load.']},
 crane:{
  skrap:['Traverskran med løftemagnet som henter skrap av seg selv. Du kan styre den selv for dobbel last.','An overhead crane with a lifting magnet that fetches scrap by itself. Drive it yourself for a double load.'],
  malm:['Gripekran som flytter malm til skipet av seg selv. Du kan styre den selv for dobbel last.','A grab crane that moves ore to the skip by itself. Drive it yourself for a double load.'],
  ose:['Øsekranen løfter fulle øser fra tappen til øseovnen og støpingen, og tomme øser tilbake.','The ladle crane lifts full ladles from the tap to the ladle furnace and casting, and empty ones back.'],
  mag:['Magnetkran som løfter emner fra kjølesenga til gjennomvarmingsovnen.','A magnet crane that lifts billets from the cooling bed to the reheating furnace.']}};
